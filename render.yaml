services:
  - type: web
    name: medtrack
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: medtrack-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
